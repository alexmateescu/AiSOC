id: det-threat-anomaly-012
name: Entra Sign-In Volume Far Above This Principal's Normal
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Entra Sign-In
  Volume Far Above This Principal's Normal'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1110.003
- tlp.white
category: threat-anomaly
log_source:
  product: azure
  service: entra
detection:
  condition: |
    event_type == "signin"
    AND baseline_principal_volume_z >= 3.0
false_positives:
- A misconfigured client retrying
- A device re-enrolment loop
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
