id: det-threat-anomaly-020
name: GitHub Organisation Setting Changed by a Rare Actor
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'GitHub Organisation
  Setting Changed by a Rare Actor'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- mitre.attack.t1195.001
- tlp.white
category: threat-anomaly
log_source:
  product: github
  service: audit
detection:
  condition: |
    action STARTSWITH "org."
    AND baseline_action_rarity >= 0.95
false_positives:
- A new organisation owner
- A one-off policy change during onboarding
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
