id: det-threat-anomaly-008
name: Admin Role Granted by a Principal Who Does Not Normally Grant Roles
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Admin Role
  Granted by a Principal Who Does Not Normally Grant Roles'. Watch the 2 documented false-positive cases
  before tuning.
version: 1.0.0
severity: critical
tags:
- mitre.attack.t1098.003
- tlp.white
category: threat-anomaly
log_source:
  product: okta
  service: identity
detection:
  condition: |
    event_type IN ["user.account.privilege.grant", "group.privilege.grant"]
    AND baseline_action_rarity >= 0.95
false_positives:
- A delegated admin covering for the usual owner
- Quarterly access review remediation
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
