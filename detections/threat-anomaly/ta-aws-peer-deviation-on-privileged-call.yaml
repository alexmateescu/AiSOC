id: det-threat-anomaly-006
name: AWS Privileged Call Volume Far Above This Principal's Peer Group
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'AWS Privileged
  Call Volume Far Above This Principal's Peer Group'. Watch the 2 documented false-positive cases before
  tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- tlp.white
category: threat-anomaly
log_source:
  product: aws
  service: iam
detection:
  condition: |
    eventSource == "iam.amazonaws.com"
    AND baseline_peer_deviation >= 3.0
false_positives:
- A team of one, where the peer group is the principal
- An on-call week
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
