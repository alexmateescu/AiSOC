id: det-threat-anomaly-014
name: OAuth Application Activity Far Above Its Own Normal
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'OAuth Application
  Activity Far Above Its Own Normal'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1550.001
- mitre.attack.t1530
- tlp.white
category: threat-anomaly
log_source:
  product: google-workspace
  service: oauth
detection:
  condition: |
    event_type == "oauth_token_event"
    AND baseline_oauth_app_volume_z >= 3.0
false_positives:
- A legitimate integration's first sync
- A vendor rolling out a new feature
playbook: tpl-data-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
