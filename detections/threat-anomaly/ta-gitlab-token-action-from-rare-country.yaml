id: det-threat-anomaly-022
name: GitLab Token Action From a Country This Principal Has Never Used
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'GitLab Token
  Action From a Country This Principal Has Never Used'. Watch the 3 documented false-positive cases before
  tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- tlp.white
category: threat-anomaly
log_source:
  product: gitlab
  service: audit
detection:
  condition: |
    event_type CONTAINS "token"
    AND baseline_location_rarity >= 0.95
false_positives:
- Travel
- A relocated contributor
- A VPN egress
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
