id: det-threat-anomaly-017
name: Mailbox Rule Created From a Client This Principal Has Never Used
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Mailbox Rule
  Created From a Client This Principal Has Never Used'. Watch the 2 documented false-positive cases before
  tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1114.003
- mitre.attack.t1564.008
- tlp.white
category: threat-anomaly
log_source:
  product: m365
  service: exchange
detection:
  condition: |
    operation IN ["New-InboxRule", "Set-InboxRule"]
    AND baseline_client_family_rarity >= 0.95
false_positives:
- A newly installed desktop client
- A mobile mail app added to an account
playbook: tpl-account-takeover
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
