id: det-threat-anomaly-021
name: Repository Clone Volume Far Above This Principal's Normal
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Repository
  Clone Volume Far Above This Principal's Normal'. Watch the 2 documented false-positive cases before
  tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1213.003
- tlp.white
category: threat-anomaly
log_source:
  product: github
  service: audit
detection:
  condition: |
    action IN ["git.clone", "repo.download_zip"]
    AND baseline_principal_volume_z >= 3.0
false_positives:
- A fresh developer workstation setup
- A CI fleet scaling up
playbook: tpl-data-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
