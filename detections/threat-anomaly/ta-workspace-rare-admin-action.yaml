id: det-threat-anomaly-015
name: Workspace Admin Action This Principal Has Never Performed
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Workspace
  Admin Action This Principal Has Never Performed'. Watch the 2 documented false-positive cases before
  tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098
- tlp.white
category: threat-anomaly
log_source:
  product: google-workspace
  service: admin
detection:
  condition: |
    event_type == "admin"
    AND baseline_action_rarity >= 0.95
false_positives:
- A new administrator's first month
- A delegated admin covering leave
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
