id: det-threat-anomaly-001
name: AWS Access Key Created From a Client This Principal Has Never Used
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'AWS Access
  Key Created From a Client This Principal Has Never Used'. Watch the 2 documented false-positive cases
  before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1098.001
- mitre.attack.t1078.004
- tlp.white
category: threat-anomaly
log_source:
  product: aws
  service: iam
detection:
  condition: |
    eventName == "CreateAccessKey"
    AND baseline_client_family_rarity >= 0.95
false_positives:
- A new build agent or CI runner adopting a different SDK will look novel once
- An engineer moving from the console to the CLI for the first time
playbook: tpl-credential-compromise
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
