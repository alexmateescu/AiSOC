id: det-threat-anomaly-016
name: Drive Download Volume Far Above This Principal's Normal
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Drive Download
  Volume Far Above This Principal's Normal'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1530
- tlp.white
category: threat-anomaly
log_source:
  product: google-workspace
  service: drive
detection:
  condition: |
    event_type == "drive"
    AND baseline_principal_volume_z >= 3.0
false_positives:
- A departing employee's sanctioned export
- An offline-sync client's first pass
playbook: tpl-data-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
