id: det-threat-anomaly-009
name: Sign-In From a Client Family This Principal Has Never Used
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Sign-In From
  a Client Family This Principal Has Never Used'. Watch the 3 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1078.004
- mitre.attack.t1550
- tlp.white
category: threat-anomaly
log_source:
  product: okta
  service: identity
detection:
  condition: |
    event_type == "user.session.start"
    AND baseline_client_family_rarity >= 0.95
false_positives:
- A new laptop or phone
- A browser major-version bump
- A newly adopted SDK
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
