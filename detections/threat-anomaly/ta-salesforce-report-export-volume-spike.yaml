id: det-threat-anomaly-019
name: Salesforce Export Volume Far Above This Principal's Normal
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Salesforce
  Export Volume Far Above This Principal's Normal'. Watch the 2 documented false-positive cases before
  tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1530
- tlp.white
category: threat-anomaly
log_source:
  product: salesforce
  service: audit
detection:
  condition: |
    event_type IN ["ReportExport", "BulkApi"]
    AND baseline_principal_volume_z >= 3.0
false_positives:
- Quarter-end reporting
- A sanctioned CRM migration
playbook: tpl-data-exfiltration
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
