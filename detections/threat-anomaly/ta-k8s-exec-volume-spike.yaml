id: det-threat-anomaly-024
name: Pod Exec Volume Far Above This Principal's Normal
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Pod Exec
  Volume Far Above This Principal's Normal'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: medium
tags:
- mitre.attack.t1609
- tlp.white
category: threat-anomaly
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    resource CONTAINS "pods/exec"
    AND baseline_principal_volume_z >= 3.0
false_positives:
- An incident response shift
- A debugging session on a failing deployment
playbook: tpl-triage
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
