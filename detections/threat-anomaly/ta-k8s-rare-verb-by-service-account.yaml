id: det-threat-anomaly-023
name: Kubernetes Verb This Service Account Has Never Used
description: AiSOC v1 curated detection. Triggers on the threat-anomaly signal described by 'Kubernetes
  Verb This Service Account Has Never Used'. Watch the 2 documented false-positive cases before tuning.
version: 1.0.0
severity: high
tags:
- mitre.attack.t1609
- mitre.attack.t1078.003
- tlp.white
category: threat-anomaly
log_source:
  product: kubernetes
  service: audit
detection:
  condition: |
    action IN ["create", "delete", "patch"]
    AND resource CONTAINS "clusterrolebinding"
    AND baseline_action_rarity >= 0.95
false_positives:
- A cluster bootstrap
- An operator installing its own RBAC on first run
playbook: tpl-privilege-escalation
enabled: true
author: AiSOC
created: '2026-05-03'
modified: '2026-05-03'
